services:
  postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: lista
      POSTGRES_PASSWORD: lista
      POSTGRES_DB: lista
    ports:
      # 5442 na hoście: nie koliduje z lokalnie zainstalowanym PostgreSQL (5432).
      - "5442:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lista -d lista"]
      interval: 2s
      timeout: 3s
      retries: 15

  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
