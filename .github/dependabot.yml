# Aktualizacje zależności (pipeline.md, etap 3; TH-22): co tydzień, grupowane.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
  # Przypięty tag i digest obrazu Node w Dockerfile (T-122): poprawki obrazu bazowego co tydzień.
  # Bez podbić major: Node zostaje na linii z .nvmrc / engines (24).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
